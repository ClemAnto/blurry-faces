<input type="file" accept="video/*" (change)="onFileSelected($event)" hidden #fileInput>

@if (!sourceUrl()) {
	<nz-result nzStatus="info" nzTitle="Carica un video per iniziare"
		nzSubTitle="Il video viene elaborato solo nel tuo browser: non viene caricato da nessuna parte.">
		<div nz-result-extra>
			<button nz-button nzType="primary"
				nzSize="large" nzShape="round"
				(click)="fileInput.click()">
				<nz-icon nzType="folder" /> Sfoglia</button>
		</div>
	</nz-result>
} @else {
	<nz-card class="max-h-[80cqh] !flex">
		@if (processing() && VideoProcessing.preview()) {
			<img class="max-h-full max-w-full m-auto rounded-lg" [src]="VideoProcessing.preview()" />
		} @else {
			<video
				class="max-h-full max-w-full m-auto rounded-lg"
				[src]="result()?.url || sourceUrl()" controls></video>
		}
	</nz-card>

	<div class="absolute top-6 left-6 right-6 flex flex-col gap-2">
		@if (modelsError()) {
			<nz-alert nzType="error" nzShowIcon nzMessage="Impossibile caricare il modello di riconoscimento volti. Ricarica la pagina."></nz-alert>
		}
		@if (error()) {
			<nz-alert nzType="error" nzShowIcon [nzMessage]="error()!"></nz-alert>
		}
		@if (result()?.audioDropped) {
			<nz-alert nzType="warning" nzShowIcon nzMessage="L'audio del video originale non è supportato: il risultato è senza audio."></nz-alert>
		}
	</div>

	<footer class="absolute bottom-6 right-6 flex justify-end items-end gap-3">
		@if (processing()) {
			<div class="flex flex-col items-center gap-1">
				<nz-progress [nzPercent]="VideoProcessing.progress()" nzType="circle" [nzWidth]="80"></nz-progress>
				<span class="text-xs">{{ phaseLabel() }}</span>
			</div>
			<button nz-button nzSize="large" nzShape="round" (click)="cancel()">Annulla</button>
		} @else {
			<button nz-button nzSize="large" nzShape="round" (click)="fileInput.click()">
				<nz-icon nzType="folder" /> Altro video</button>
			@if (result()) {
				<button nz-button nzType="primary"
					nzSize="large" nzShape="round" (click)="downloadProcessedVideo()">
					<nz-icon nzType="download" /> Scarica</button>
			} @else {
				<button nz-button nzType="primary"
					nzSize="large" nzShape="round"
					[nzLoading]="!VideoProcessing.modelsReady() && !modelsError()"
					[disabled]="!VideoProcessing.modelsReady()"
					(click)="processVideo()">
					<nz-icon nzType="play-circle" /> Elabora</button>
			}
		}
	</footer>
}
